name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
  IMAGE_REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 리포지토리 오너 이름을 소문자로 변환 (대문자로 인한 Push 에러 방지)
      - name: Lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      # 2. GHCR 로그인 (GITHUB_TOKEN 대신 쓰기 권한이 확실한 GHCR_PAT 사용)
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REPO_OWNER }}
          password: ${{ secrets.GHCR_PAT }}

      # setup driver
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Azure 로그인
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 5. [배포 1] Web 컨테이너 앱 업데이트
      - name: Deploy to Azure Container App (Web)
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ secrets.ACA_WEB_APP_NAME }}
          resourceGroup: ${{ secrets.ACA_RESOURCE_GROUP }}
          imageToDeploy: ${{ env.IMAGE_REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          registryUrl: ${{ env.IMAGE_REGISTRY }}
          registryUsername: ${{ env.REPO_OWNER }}
          registryPassword: ${{ secrets.GHCR_PAT }}

      # 6. [배포 2] Celery 컨테이너 앱 업데이트
      - name: Deploy to Azure Container App (Celery)
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ secrets.ACA_CELERY_APP_NAME }}
          resourceGroup: ${{ secrets.ACA_RESOURCE_GROUP }}
          imageToDeploy: ${{ env.IMAGE_REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          registryUrl: ${{ env.IMAGE_REGISTRY }}
          registryUsername: ${{ env.REPO_OWNER }}
          registryPassword: ${{ secrets.GHCR_PAT }}

      # 7. [배포 3] Celery Beat 컨테이너 앱 업데이트
      - name: Deploy to Azure Container App (Celery Beat)
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ secrets.ACA_CELERY_BEAT_NAME }}
          resourceGroup: ${{ secrets.ACA_RESOURCE_GROUP }}
          imageToDeploy: ${{ env.IMAGE_REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          registryUrl: ${{ env.IMAGE_REGISTRY }}
          registryUsername: ${{ env.REPO_OWNER }}
          registryPassword: ${{ secrets.GHCR_PAT }}